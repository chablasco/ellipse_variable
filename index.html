<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CB Ellipse Variable</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black; /* ensures black on page load */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    let circleX;
    let circleY;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(0); // black background, only once
    }

    function draw() {
      // Choose random position
      circleX = random(width);
      circleY = random(height);

      // Draw white circle that stays on screen
      //noStroke();
      fill(255);
      ellipse(circleX, circleY, 24, 24);
    }

    function mousePressed() {
      let fs = fullscreen();
      fullscreen(!fs);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      // Keep the background black after resize, without clearing previous ellipses
      background(0);
    }
  </script>
</body>
</html>
