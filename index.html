<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CB Ellipse Variable</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
  let circleX;
  let circleY;

  function setup() {
    createCanvas(windowWidth, windowHeight);
    circleX = width / 2;
    circleY = height / 2;
  }

  function draw() {
    background(0); // Always black background

    // Update circle position
    circleX = random(width);
    circleY = random(height);

    // Draw the circle
    fill(255);
    ellipse(circleX, circleY, 24, 24);

    // Add random movement (this doesn't persist since we redraw randomly each frame)
    circleX += random(-2, 2);
    circleY += random(-2, 2);
  }

  function mousePressed() {
    let fs = fullscreen();
    fullscreen(!fs);
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }
</script>
</body>
</html>
